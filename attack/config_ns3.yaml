# Origin inference attack, ns-3 + 10 origins (ATKN) (python -m attack.run --stage ... --config attack/config_ns3.yaml)
exp_dir: experiments/final/ATK_ns3_10origins
out_dir: experiments/final/ATK_ns3_10origins/results/attack
fig_dir: experiments/final/ATK_ns3_10origins/results/figures
ks: [1, 2, 5, 10, 20, 50, 100]   # rounds observed (first k)
pos_inputs: [90, 91, 92, 93]     # state inputs: current edge x, y (90-91), destination x, y (92-93)
pca_dim: 256                     # F_full: PCA of the whole update, fitted on training runs only
pca_fit_rows: 6000               # training samples used to fit the PCA
lr_Cs: [0.001, 0.01, 0.1, 1.0]   # L2 logistic regression, C by vehicle-grouped CV on training runs
inner_folds: 3                   # vehicle-grouped folds inside the training runs (selection only)
mlp_hidden: 128
b_draws: 20                      # method B: random k-round subsets per training vehicle (plus the first k)
control_perms: 5                 # shuffled-label control: permutations averaged
random_subset_draws: 5           # random-k-rounds variant on the target run
bootstrap: 1000                  # cluster bootstrap: runs, then vehicles within runs
seed: 0
# attack 1, known vehicles in the same run (attack/known.py)
known_per_origin: [1]              # 1 known vehicle per origin = 10 of 50 vehicles (20%) with 10 origins
known_default: [probe, A]        # headline with 1 per origin (no validation possible); chosen on the 5-origin ideal data
known_draws: 5                   # random known sets per run and share
known_C: 0.1                     # fixed L2 strength (too few known vehicles to tune it)
known_pca_dim: 64
n_jobs: 2                        # runs in parallel (memory: about 1.5 GB each at k = 100)
