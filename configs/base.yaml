---
# Configuration shared by all experiments of the paper. Each run is this file plus the changes listed
# for it in tools/run_experiment.py (method, privacy budget, ns-3 on/off, ...); the seed comes from FL_SEED.
# DQN settings not listed here are in frl/learning/ (learning rate 1e-3, batch 32, replay memory 20000,
# training starts after 200 transitions, hidden layers 150 / 100).

common:
  cfg_file : sumo/dqn.sumocfg
  port : 8080
  server_ip : 127.0.0.1
  total_episodes : 10       # training episodes per round
  log_level : info
  plot_results : False

sumo:
  start : true
  quit_on_end : true
  num_clients : 50
  shared_env : true         # all vehicles in one SUMO world, one process (run_shared.py)
  background_period : 1.75  # s between background vehicle departures
  warmup : 200              # s of background traffic before the agents can depart
  depart_window : 100       # each agent departs at a random time in [warmup, warmup + depart_window]
  use_gui : False
  start_edges : [['E0'], ['E1'], ['E3'], ['E11'], ['E8']]

experiment:
  method : "none"           # set per run: none | cpq | ldpfl | gaussian | laplace
  true_rounds : 100
  batches_per_agg : 1
  out_dir : "results"       # output folder is set by FL_OUT_DIR
  epsilon_schedule : "exponential"
  epsilon_start : 1.0
  epsilon_end : 0.05
  epsilon_decay_rounds : 80
  eval_episodes : 3
  state_encoding : raw
  max_trip_time : 600
  background_metrics : true
  road_log : false
  target_update_every : 1000
  mask_target : false
  seeds : [1, 2, 3, 4, 5]   # the launcher sets FL_SEED per run

privacy:
  epsilon : 1.0             # set per run: 0.3 | 0.5 | 1 | 2 | 5
  delta : 1.0e-5
  cpq_pairing_granularity : coordinate
  cpq_pairing : local
  cpq_group_key : seeded    # ns-3 runs use ml_kem (group setup over the RSU)
  cpq_lambda : 1.0          # CPQ-lambda: 0.75 in the paper; 1 = CPQ
  lambda_smooth : 1.0       # 1 = plain average of the decoded updates
  clip_radius :             # per layer, r in the paper
    fc1.weight : 0.02
    fc1.bias : 0.02
    fc2.weight : 0.02
    fc2.bias : 0.02
    fc_out.weight : 0.02
    fc_out.bias : 0.02

ns3:
  use_ns3 : false           # true in E2, E3 and the attack runs
  pqc_scheme : "ML-DSA-44"
  key_dir : "pqc_keys"
  oracle_ip : "127.0.0.1"
  oracle_port : 12345
  downlink_base_port : 25000
  ns3_dir : "~/ns-3.46"
  fl_sim_args : ""          # extra fl-sim options (default channel: coverage ends at about 150-200 m)
  rsu_junction : "J3"
  discovery : beacon
  beacon_interval : 0.1
  beacon_timeout : 0.5
  beacon_min : 3
  coverage_radius : 150     # only for discovery: distance
  rsu_max_concurrent : 1
  schedule_step : 0.1
  setup_max_drives : 20     # CPQ group setup must finish within this many drives
  drop_undelivered : true
